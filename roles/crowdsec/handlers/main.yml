---
- name: Reload CrowdSec
  ansible.builtin.service:
    name: crowdsec
    state: reloaded

- name: Restart CrowdSec
  ansible.builtin.service:
    name: crowdsec
    state: restarted

- name: Restart crowdsec-spoa-bouncer
  ansible.builtin.service:
    name: crowdsec-spoa-bouncer
    state: restarted
