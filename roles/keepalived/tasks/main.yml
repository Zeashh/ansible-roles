- name: Install keepalived
  apt:
    package: keepalived
    update_cache: true
  tags:
    - keepalived

- name: Start and enable keepalived
  service:
    name: keepalived
    enabled: true
    state: started
  tags:
    - keepalived

- name: Write check script
  template:
    src: "{{ keepalived_template_check_script }}"
    dest: "{{ keepalived_check_script_dest }}"
    lstrip_blocks: true
    owner: root
    group: root
    mode: 0755
  tags:
    - keepalived

- name: Write notify script
  template:
    src: "{{ keepalived_template_notify_script }}"
    dest: "{{ keepalived_notify_script_dest }}"
    lstrip_blocks: true
    owner: root
    group: root
    mode: 0755
  tags:
    - keepalived

- name: Write keepalived conf
  template:
    src: "{{ keepalived_template_keepalived_conf }}"
    dest: /etc/keepalived/keepalived.conf
    lstrip_blocks: true
    owner: root
    group: root
    mode: 0640
    validate: /sbin/keepalived -t -f %s
    backup: true
  notify: Reload keepalived
  tags:
    - keepalived

- name: Enable nonlocal binding
  ansible.posix.sysctl:
    sysctl_file: /etc/sysctl/99-nonlocal-bind.conf
    name: "net.ipv4.ip_nonlocal_bind"
    value: "1"
    sysctl_set: true
    reload: true
