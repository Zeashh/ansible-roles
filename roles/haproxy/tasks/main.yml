- name: Install HAProxy
  apt:
    package: haproxy
    update_cache: true
  tags:
    - haproxy

- name: Install certbot and Cloudflare plugin
  apt:
    package:
      - certbot
      - python3-certbot-dns-cloudflare
  tags:
    - haproxy

- name: Create HAProxy config directory
  file:
    path: /etc/haproxy
    state: directory
    mode: 0770
    owner: root
    group: root
  tags:
    - haproxy

- name: Create certificate directory
  file:
    path: /etc/haproxy/certificates
    state: directory
    mode: 0770
    owner: root
    group: root
  tags:
    - haproxy

- name: Create library directory
  file:
    path: /etc/haproxy/lib
    state: directory
    mode: 0770
    owner: root
    group: root
  tags:
    - haproxy

- name: Write certificate helper script
  template:
    src: "{{ haproxy_template_certbot_helper }}"
    dest: "{{ haproxy_certbot_script_path }}"
    mode: 0755
    owner: root
    group: root
  tags:
    - haproxy

- name: Create secrets directory
  file:
    path: "{{ haproxy_secrets_path }}"
    state: directory
    mode: 0700
    owner: root
    group: root
  tags:
    - haproxy

- name: Write Cloudflare secret
  template:
    src: "{{ haproxy_template_cloudflare_ini }}"
    dest: "{{ haproxy_secrets_path }}/cloudflare.ini"
    mode: 0700
    owner: root
    group: root
  tags:
    - haproxy

- name: Issue all defined certificates
  command: "{{ haproxy_certbot_script_path }} {{ item.cn }} {{ item.valid_for | map('quote') | join(' ') }}"
  changed_when: false
  loop: "{{ haproxy_certificates }}"
  tags:
    - haproxy

- name: Create hooks directory
  file:
    path: /etc/letsencrypt/renewal-hooks/post
    mode: "0755"
    owner: root
    group: root
    state: directory
  tags:
    - haproxy

- name: Upload certificate copy script
  copy:
    src: "{{ haproxy_file_copy_certs }}"
    dest: /etc/letsencrypt/renewal-hooks/post/copy-certs.sh
    mode: "0755"
    owner: root
    group: root
  tags:
    - haproxy

- name: Upload Lua CORS library
  copy:
    src: "{{ haproxy_file_cors }}"
    dest: /etc/haproxy/lib/cors.lua
    mode: "0660"
    owner: root
    group: root
  tags:
    - haproxy

- name: Upload error pages
  copy:
    src: "{{ haproxy_file_error_pages }}"
    dest: /etc/haproxy/
    mode: "0660"
    owner: root
    group: root
  tags:
    - haproxy

- name: Upload certificate list
  template:
    src: "{{ haproxy_template_certificate_list }}"
    dest: /etc/haproxy/certificate-list.txt
    mode: "0660"
    owner: root
    group: root
  tags:
    - haproxy

- name: Upload Crowdsec HAProxy-side config
  template:
    src: "{{ haproxy_template_crowdsec_cfg }}"
    dest: /etc/haproxy/crowdsec.cfg
    mode: "0660"
    owner: root
    group: root
    lstrip_blocks: true
  notify: Reload HAProxy
  tags:
    - haproxy

- name: Upload HAProxy config
  template:
    src: "{{ haproxy_template_haproxy_cfg }}"
    dest: /etc/haproxy/haproxy.cfg
    mode: "0660"
    owner: root
    group: root
    lstrip_blocks: true
    # Also validates Crowdsec config
    validate: /usr/sbin/haproxy -c -f %s
    backup: true
  notify: Reload HAProxy
  tags:
    - haproxy

- name: Start and enable HAProxy
  service:
    name: haproxy
    enabled: true
    state: started
  tags:
    - haproxy
