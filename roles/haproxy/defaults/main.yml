# Role file/template paths
haproxy_file_copy_certs: "copy-certs.sh"
haproxy_file_cors: "cors.lua"
haproxy_file_error_pages: "error-pages"
haproxy_template_certbot_helper: "certbot-helper.sh.j2"
haproxy_template_cloudflare_in: "cloudflare.ini.j2"
haproxy_template_certificate_list: "certificate-list.txt.j2"
haproxy_template_haproxy_cfg: "haproxy.cfg.j2"
haproxy_template_crowdsec_cfg: "crowdsec.cfg.j2"

# Miscellaneous
haproxy_certbot_script_path: /usr/local/bin/certbot-helper.sh 
haproxy_secrets_path: /root/secrets
haproxy_certbot_script_user: "john"
haproxy_certbot_email: john@mail.com
haproxy_ips: 
  internal: 10.0.0.10
# haproxy_cloudflare_token:
haproxy_certificates:
  - cn: domain.com
    valid_for:
      - domain.com
      - "*.local.domain.com"
