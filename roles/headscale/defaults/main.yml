# Role file/template paths
headscale_file_acl: acl.json
headscale_file_headscale_backup_prepare: headscale_backup_prepare.sh
headscale_template_cloudflare_secret: cloudflare_secret.j2
headscale_template_copy_certs: copy_certs.sh.j2
headscale_template_derp: derp.yaml.j2
headscale_template_headscale_backup: headscale_backup.sh.j2
headscale_template_headscale_config: headscale_config.yaml.j2
headscale_template_ssh_config: ssh_config.j2

# Inventory groups
headscale_headscale_group: headscale_server
headscale_jumphost_group: headscale_jump

# Headscale
headscale_domain: domain.com
headscale_public_ip: 5.5.5.5
headscale_headscale_version: 0.29.4
headscale_headscale_arch: amd64
headscale_headscale_download_url: "https://github.com/juanfont/headscale/releases/download/v{{ headscale_version }}/headscale_{{ headscale_version }}_linux_{{ headscale_arch }}.deb"
headscale_derp_enabled: true
headscale_dns_servers:
  - 8.8.8.8
  - 1.1.1.1
headscale_search_domains:
  - local.domain.com

# Let's Encrypt
headscale_secrets_dir: /root/secrets
headscale_letsencrypt_email: john@mail.com
headscale_remote_cf_secrets_file: "{{ secrets_dir }}/cloudflare.ini"
headscale_cf_api_token: token
headscale_cert_path: "/etc/letsencrypt/live/{{ headscale_domain }}"
headscale_cert_destination_path: /etc/headscale/certs

# SSH
headscale_ssh_remote_user: john
headscale_jump_generate_ed25519: true
headscale_jump_ssh_key_path: "/home/{{ headscale_ssh_remote_user }}/.ssh/id_ed25519"
headscale_headscale_authorized_keys: "/home/{{ headscale_ssh_remote_user }}/.ssh/authorized_keys"
headscale_headscale_ssh_port: 22

# Backups (run daily)
headscale_backup_hour: 5
headscale_keep_last: 2
headscale_scripts_dir: "/home/{{ ssh_remote_user }}/scripts"
headscale_backup_script_name: headscale_backup.sh
headscale_backup_script_path: "{{ scripts_dir }}/{{ backup_script_name }}"
headscale_backup_prepare_script_name: headscale_backup_prepare.sh
headscale_backup_prepare_script_path: "{{ scripts_dir }}/{{ backup_prepare_script_name }}"
