- name: SSH tasks
  import_tasks: ssh.yaml
  tags:
    - headscale_ssh

- name: Headscale tasks
  import_tasks: headscale.yaml
  when: headscale_headscale_group in group_names
  tags:
    - headscale_server

- name: Certbot tasks
  import_tasks: certbot.yaml
  when: headscale_headscale_group in group_names
  tags:
    - headscale_certbot

- name: Set up scripts on jump host
  import_tasks: jump_scripts.yaml
  tags:
    - headscale_backup
