- name: Install ISC DHCP server
  apt:
    package: isc-dhcp-server
    update_cache: true
  tags:
    - isc_dhcp

- name: Upload isc_dhcp config
  template:
    src: "{{ isc_dhcp_template_dhcpd_conf }}"
    dest: /etc/dhcp/dhcpd.conf
    mode: "0644"
    owner: root
    group: root
    lstrip_blocks: true
    validate: /sbin/dhcpd -t -cf %s
    backup: true
  notify: Reload isc-dhcp-server.service
  tags:
    - isc_dhcp

- name: Start and enable isc-dhcp-server
  service:
    name: isc-dhcp-server
    enabled: true
    state: started
  tags:
    - isc_dhcp
