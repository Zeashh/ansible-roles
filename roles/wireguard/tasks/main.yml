- name: Generate SSH key on master host
  community.crypto.openssh_keypair:
    path: "{{ wireguard_ssh_key_path }}"
    type: ed25519
  delegate_to: "{{ ( groups[wireguard_group] | sort )[0] }}"
  run_once: true
  tags:
    - wireguard

- name: Read public key
  ansible.builtin.slurp:
    src: "{{ wireguard_ssh_key_path }}.pub"
  register: pubkey
  delegate_to: "{{ ( groups[wireguard_group] | sort )[0] }}"
  run_once: true
  tags:
    - wireguard

- name: Add key to target's authorized_keys
  ansible.posix.authorized_key:
    user: root
    key: "{{ pubkey.content | b64decode }}"
    path: "{{ wireguard_authorized_keys_file }}"
  delegate_to: "{{ ( groups[wireguard_group] | sort )[1] }}"
  run_once: true
  tags:
    - wireguard

- name: Permit root login on target
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-root-login.conf
    content: "PermitRootLogin prohibit-password\n"
    mode: "0644"
    validate: sshd -t -f %s
  notify: Restart sshd
  delegate_to: "{{ ( groups[wireguard_group] | sort )[1] }}"
  run_once: true
  tags:
    - wireguard

- name: Apply changes now
  ansible.builtin.meta: flush_handlers
  tags:
    - wireguard

- name: Read target host key
  ansible.builtin.slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  register: target_hostkey
  delegate_to: "{{ ( groups[wireguard_group] | sort )[1] }}"
  run_once: true
  tags:
    - wireguard

- name: Add target to master's known_hosts
  ansible.builtin.known_hosts:
    path: /root/.ssh/known_hosts
    name: "{{ hostvars[( groups[wireguard_group] | sort )[1]]['ansible_host'] | default(( groups[wireguard_group] | sort )[1]) }}"
    key: "{{ hostvars[( groups[wireguard_group] | sort )[1]]['ansible_host'] | default(( groups[wireguard_group] | sort )[1]) }} {{ (target_hostkey.content | b64decode).split()[0:2] | join(' ') }}"
  delegate_to: "{{ ( groups[wireguard_group] | sort )[0] }}"
  run_once: true
  tags:
    - wireguard

- name: Create compose directory
  file:
    path: "{{ wireguard_project_path }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  tags:
    - wireguard

- name: Write config sync script
  template:
    src: "{{ wireguard_template_sync_script }}"
    dest: "{{ wireguard_project_path }}/sync.sh"
    lstrip_blocks: true
    owner: root
    group: root
    mode: 0755
  notify: Sync Wireguard configs
  delegate_to: "{{ ( groups[wireguard_group] | sort )[0] }}"
  run_once: true
  tags:
    - wireguard

- name: Make a cron job for syncing Wireguard configs
  ansible.builtin.cron:
    name: "Sync Wireguard configs"
    minute: "0"
    hour: "3"
    job: "{{ wireguard_project_path }}/sync.sh"
  delegate_to: "{{ ( groups[wireguard_group] | sort )[0] }}"
  run_once: true
  tags:
    - wireguard

- name: Write compose file
  template:
    src: "{{ wireguard_template_compose_yaml }}"
    dest: "{{ wireguard_project_path }}/docker-compose.yaml"
    lstrip_blocks: true
    owner: root
    group: root
    mode: 0600
  notify: Sync Wireguard configs
  tags:
    - wireguard

- name: Run compose up
  community.docker.docker_compose_v2:
    project_src: "{{ wireguard_project_path }}"
    state: present
    remove_orphans: true
  tags:
    - wireguard
