# Rolefile/template paths
wireguard_template_compose_yaml: "docker-compose.yaml.j2"
wireguard_template_sync_script: "wireguard_sync.sh.j2"
wireguard_template_fetch_script: "wgfetch.sh.j2"

# Inventory group
wireguard_group: edge

# General settings
wireguard_ssh_key_path: /root/.ssh/id_ed25519_wireguard
wireguard_authorized_keys_file: /root/.ssh/ansible_authorized_keys
wireguard_project_path: /opt/compose/wireguard
wireguard_image: linuxserver/wireguard:1.0.20250521
wireguard_container_name: wireguard
wireguard_port: 51820
wireguard_timezone: Etc/UTC
wireguard_fetch_script_dest: /usr/local/bin/wgfetch

# These corelate to container's environment variables
wireguard_internal_subnet: 10.100.100.0
wireguard_log_confs: "true"
wireguard_peerdns: "10.0.0.1"
# Comma separated
wireguard_peers: "JohnPhone"
wireguard_puid: 7000
wireguard_pgid: 7000
wireguard_serverurl: "vpn.domain.com"
