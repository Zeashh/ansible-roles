- name: Restart systemd-logind
  service:
    name: systemd-logind
    state: restarted

- name: Reset list of failed services
  shell: systemctl reset-failed

- name: Restart SSH server
  service:
    name: sshd
    state: restarted

- name: Enable QEMU guest agent service
  service:
    name: qemu-guest-agent
    enabled: true

- name: Start QEMU guest agent
  service:
    name: qemu-guest-agent
    state: started

- name: Enable qdevice
  service:
    name: corosync-qnetd
    state: enabled

- name: Start qdevice
  service:
    name: corosync-qnetd
    state: started

- name: Restart unattended-upgrades.service
  service:
    name: unattended-upgrades
    state: restarted
