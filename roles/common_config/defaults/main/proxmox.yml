---
# Inventory groups
common_config_pve_group: "pve_nodes"
common_config_pbs_group: "pbs_nodes"
common_config_qdevice_group: "pve_qdevice"

# Shout-out to this great project!
common_config_subscription_url: "https://github.com/Jamesits/pve-fake-subscription/releases/download/v0.0.12/pve-fake-subscription_0.0.12+git-1_all.deb"
common_config_subscription_check_url: "shop.maurer-it.com"

common_config_proxmox_unwanted_packages: []
common_config_proxmox_mandatory_packages:
  - corosync-qdevice

common_config_backup_namespace: "prod/daily"
common_config_backup_keyfile: "/root/secrets/backup-key.enc"
common_config_backup_secret: "/root/secrets/pbs.env"
common_config_backup_pve_include: "etc.pxar:/etc var_lib_pve-cluster.pxar:/var/lib/pve-cluster home.pxar:/root"
common_config_backup_pbs_include: "etc.pxar:/etc root.pxar:/root"
