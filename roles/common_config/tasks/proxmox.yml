---
- name: Modify PBS repositories
  when: inventory_hostname in groups[common_config_pbs_group]

  block:
    - name: Remove enterprise PBS repository
      ansible.builtin.deb822_repository:
        name: pbs-enterprise
        state: absent
    - name: Add no-subscription PBS repository
      ansible.builtin.deb822_repository:
        name: pbs-no-subscription
        types: deb
        uris: http://download.proxmox.com/debian/pbs
        suites: "{{ common_config_debian_suite }}"
        components:
          - pbs-no-subscription
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
- name: Modify PVE repositories
  when: inventory_hostname in groups[common_config_pve_group]

  block:
    - name: Remove enterprise PVE repository
      ansible.builtin.deb822_repository:
        name: pve-enterprise
        state: absent
    - name: Remove enterprise Ceph repository
      ansible.builtin.deb822_repository:
        name: ceph
        state: absent
    - name: Add no-subscription PVE repository
      ansible.builtin.deb822_repository:
        name: pve-no-subscription
        types: deb
        uris: http://download.proxmox.com/debian/pve
        suites: "{{ common_config_debian_suite }}"
        components:
          - pve-no-subscription
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Check if fake subscription is installed
  ansible.builtin.import_tasks: set-up-fake-subscription.yml
  when: "'pve-fake-subscription' not in ansible_facts.packages"

- name: Update repos and install useful packages
  ansible.builtin.apt:
    update_cache: true
    package: "{{ common_config_proxmox_mandatory_packages }}"
    lock_timeout: 180
  register: apt_result
  retries: 10
  delay: 30
  until: apt_result is succeeded

- name: Uninstall unwanted packages
  ansible.builtin.apt:
    package: "{{ common_config_proxmox_unwanted_packages }}"
    state: absent
    purge: true
    lock_timeout: 180
  register: apt_result
  retries: 10
  delay: 30
  until: apt_result is succeeded

- name: Write backup script
  ansible.builtin.template:
    src: "{{ common_config_template_proxmox_backup }}"
    dest: /root/scripts/proxmox-backup.sh
    lstrip_blocks: true
    owner: root
    group: root
    mode: "0755"
  vars:
    common_config_backup_include: "{{ common_config_backup_pve_include if common_config_pve_group in group_names else common_config_backup_pbs_include }}"

- name: Set cronjob for running backups
  ansible.builtin.cron:
    name: Proxmox backups
    job: /root/scripts/proxmox-backup.sh
    minute: "30"
    hour: "0"
    user: "root"
