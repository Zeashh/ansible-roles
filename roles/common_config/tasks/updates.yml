- name: Update repos and install useful packages
  apt:
    update_cache: true
    package: "{{ common_config_mandatory_packages }}"
    lock_timeout: 180
  register: apt_result
  retries: 10
  delay: 30
  until: apt_result is succeeded

- name: Uninstall unwanted packages
  apt:
    package: "{{ common_config_unwanted_packages }}"
    state: absent
    purge: true
    lock_timeout: 180
  register: apt_result
  retries: 10
  delay: 30
  until: apt_result is succeeded

- name: Set up unattended-upgrades configuration
  copy:
    src: "{{ common_config_file_unattended_upgrades }}"
    dest: "/etc/apt/apt.conf.d/50unattended-upgrades"
  notify: Restart unattended-upgrades.service

- name: Install QEMU guest agent
  apt:
    package: qemu-guest-agent
    state: latest
  notify:
    - Enable QEMU guest agent service
    - Start QEMU guest agent
  when:
    - ansible_facts['virtualization_type'] == 'kvm'
    - ansible_facts['virtualization_role'] == 'guest'

- name: Set up QDevice
  block:
    - name: Install qdevice backend on qdevice host
      apt:
        package:
          - corosync-qdevice
          - corosync-qnetd
        state: latest
    - name: Enable and start qdevice
      ansible.builtin.service:
        name: corosync-qnetd
        enabled: true
        state: started
  when: common_config_qdevice_group in group_names

- name: apt autoremove
  apt:
    autoremove: true
    lock_timeout: 180
  register: apt_result
  retries: 10
  delay: 30
  until: apt_result is succeeded

- name: apt clean
  apt:
    clean: true
    lock_timeout: 180
  register: apt_result
  retries: 10
  delay: 30
  until: apt_result is succeeded
