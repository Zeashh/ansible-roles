- name: Turn VM into template
    - name: Shutdown VM
      community.proxmox.proxmox_kvm:
        id: "{{ proxmox_templates_template.id }}"
        state: stopped
        force: true
    - name: Turn VM into template
      community.proxmox.proxmox_kvm:
        id: "{{ proxmox_templates_template.id }}"
        state: template
  when: proxmox_templates_template.type == 'vm'

- name: Turn LXC into template
    - name: Shutdown LXC
      community.proxmox.proxmox:
        id: "{{ proxmox_templates_template.id }}"
        state: stopped
        force: true
    - name: Turn LXC into template
      community.proxmox.proxmox:
        id: "{{ proxmox_templates_template.id }}"
        state: template
  when: proxmox_templates_template.type == 'lxc'
