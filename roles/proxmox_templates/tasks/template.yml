- name: Turn VM into template
  block:
    - name: Shutdown VM
      community.proxmox.proxmox_kvm:
        vmid: "{{ proxmox_templates_template.id }}"
        state: stopped
        force: true
    - name: Turn VM into template
      community.proxmox.proxmox_kvm:
        vmid: "{{ proxmox_templates_template.id }}"
        state: template
  delegate_to: localhost
  when: proxmox_templates_template.type == 'vm'

- name: Turn LXC into template
  block:
    - name: Shutdown LXC
      community.proxmox.proxmox:
        vmid: "{{ proxmox_templates_template.id }}"
        state: stopped
        force: true
    - name: Turn LXC into template
      community.proxmox.proxmox:
        vmid: "{{ proxmox_templates_template.id }}"
        state: template
  delegate_to: localhost
  when: proxmox_templates_template.type == 'lxc'
