- name: "Delete existing VM template (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
  community.proxmox.proxmox_kvm:
    vmid: "{{ proxmox_templates_template.id }}"
    state: absent
    force: true
    timeout: 180
  when: proxmox_templates_template.type == 'vm'

- name: "Delete existing LXC template (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
  community.proxmox.proxmox:
    vmid: "{{ proxmox_templates_template.id }}"
    state: absent
    force: true
  when: proxmox_templates_template.type == 'lxc'
