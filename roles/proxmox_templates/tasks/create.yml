- name: Create and start VM
  block:
    - name: "Download cloud image into import storage (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      community.proxmox.proxmox_template:
        node: "{{ proxmox_templates_template.node }}"
        storage: "{{ proxmox_templates_vm_import_storage }}"
        content_type: import
        url: "{{ proxmox_templates_template.disk }}"
        state: present
    - name: "Create VM (without disk) (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      community.proxmox.proxmox_kvm:
        vmid: "{{ proxmox_templates_template.id }}"
        node: "{{ proxmox_templates_template.node }}"
        name: "{{ proxmox_templates_template.name }}"
        ostype: "{{ proxmox_templates_template.ostype }}"
        machine: q35
        cores: "{{ proxmox_templates_template.cores }}"
        memory: "{{ proxmox_templates_template.memory }}"
        net:
          net0: "virtio,bridge={{ proxmox_templates_template.network_bridge }},firewall=1"
        agent: true
        bios: ovmf
        efidisk0:
          storage: "{{ proxmox_templates_template.storage }}"
          format: "{{ proxmox_templates_template.disk_format }}"
          efitype: "4m"
          pre_enrolled_keys: false
        serial:
          serial0: socket
        scsihw: virtio-scsi-single
        ide:
          ide0: "{{ proxmox_templates_template.storage }}:cloudinit,format={{ proxmox_templates_template.disk_format }}"
          ide1: "none,media=cdrom"
        # Cloud-init settings
        ciuser: "{{ proxmox_templates_template.user }}"
        cipassword: "{{ proxmox_templates_template.user_password }}"
        ipconfig:
          ipconfig0: "ip={{ proxmox_templates_template.ip }}{{ (',gw=' ~ proxmox_templates_template.gateway) if proxmox_templates_template.gateway is defined else '' }}"
        nameservers: "{{ proxmox_templates_template.nameservers | default(omit) }}"
        searchdomains: "{{ proxmox_templates_template.searchdomains | default(omit) }}"
        sshkeys: "{{ proxmox_templates_template.sshkeys | join('\n') | default(omit)}}"
        tags: "{{ proxmox_templates_template.tags | default(omit) }}"
    - name: "Attach downloaded disk to VM (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      community.proxmox.proxmox_disk:
        vmid: "{{ proxmox_templates_template.id }}"
        disk: scsi0
        storage: "{{ proxmox_templates_template.storage }}"
        import_from: "{{ proxmox_templates_vm_import_storage }}:import/{{ proxmox_templates_template.disk | basename }}"
        format: "{{ proxmox_templates_template.disk_format }}"
        state: present
    - name: "Resize VM disk (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      community.proxmox.proxmox_disk:
        vmid: "{{ proxmox_templates_template.id }}"
        disk: scsi0
        size: "{{ proxmox_templates_template.disk_size }}G"
        state: resized
    - name: "Change boot order (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      community.proxmox.proxmox_kvm:
        vmid: "{{ proxmox_templates_template.id }}"
        node: "{{ proxmox_templates_template.node }}"
        boot: "order=ide1;scsi0;net0"
        update: true
    - name: "Enable VM-level firewall (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      ansible.builtin.command: >
        pvesh set /nodes/{{ proxmox_templates_template.node }}/qemu/{{ proxmox_templates_template.id }}/firewall/options --enable 1
      delegate_to: "{{ proxmox_templates_template.node }}"
      changed_when: true
    - name: "Start VM (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      community.proxmox.proxmox_kvm:
        vmid: "{{ proxmox_templates_template.id }}"
        state: started
    - name: "Wait for VM to boot (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      ansible.builtin.pause:
        seconds: 60
  when: proxmox_templates_template.type == 'vm'

- name: Create and start LXC
  block:
    - name: Download LXC template
      community.proxmox.proxmox_template:
        node: "{{ proxmox_templates_template.node }}"
        storage: "{{ proxmox_templates_lxc_template_storage }}"
        content_type: vztmpl
        template: "{{ proxmox_templates_template.disk }}"
    - name: "Create LXC container (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      community.proxmox.proxmox:
        state: present
        vmid: "{{ proxmox_templates_template.id }}"
        node: "{{ proxmox_templates_template.node }}"
        hostname: "{{ proxmox_templates_template.name }}"
        password: "{{ proxmox_templates_template.root_password }}"
        ostemplate: "{{ proxmox_templates_lxc_template_storage }}:vztmpl/{{ proxmox_templates_template.disk }}"
        cores: "{{ proxmox_templates_template.cores }}"
        memory: "{{ proxmox_templates_template.memory }}"
        nameserver: "{{ proxmox_templates_template.nameservers[0] | default(omit) }}"
        disk_volume:
          storage: "{{ proxmox_templates_template.storage }}"
          size: "{{ proxmox_templates_template.disk_size }}"
          options:
            acl: "1"
        netif:
          net0: "name=eth0,bridge={{ proxmox_templates_template.network_bridge }},ip={{ proxmox_templates_template.ip }}{{ (',gw=' ~ proxmox_templates_template.gateway) if proxmox_templates_template.gateway is defined else '' }}"
        timezone: host
        unprivileged: "{{ proxmox_templates_template.unprivileged }}"
        features:
          - nesting=1
        tags: "{{ proxmox_templates_template.tags }}"
    - name: "Start LXC container (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      community.proxmox.proxmox:
        state: started
        vmid: "{{ proxmox_templates_template.id }}"
    - name: "Add local user (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      ansible.builtin.command: >
        pct exec {{ proxmox_templates_template.id }} --
        useradd -m -s /usr/bin/bash {{ proxmox_templates_template.user }}
      delegate_to: "{{ proxmox_templates_template.node }}"
    - name: "Set user password (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      ansible.builtin.command:
        cmd: "pct exec {{ proxmox_templates_template.id }} -- chpasswd"
        stdin: "{{ proxmox_templates_template.user }}:{{ proxmox_templates_template.user_password }}"
      delegate_to: "{{ proxmox_templates_template.node }}"
      no_log: true
    - name: "Add local user to sudoers (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      ansible.builtin.command: >
        pct exec {{ proxmox_templates_template.id }} -- sh -c
        'apt update &&
        apt install -y sudo &&
        usermod -aG sudo {{ proxmox_templates_template.user }}'
      delegate_to: "{{ proxmox_templates_template.node }}"
    - name: "Add SSH keys to local user (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
      ansible.builtin.command:
        cmd: >
          pct exec {{ proxmox_templates_template.id }} -- sh -c
          'mkdir -p /home/{{ proxmox_templates_template.user }}/.ssh &&
          cat > /home/{{ proxmox_templates_template.user }}/.ssh/authorized_keys &&
          chown -R {{ proxmox_templates_template.user }}:{{ proxmox_templates_template.user }} /home/{{ proxmox_templates_template.user }}/.ssh &&
          chmod 700 /home/{{ proxmox_templates_template.user }}/.ssh &&
          chmod 600 /home/{{ proxmox_templates_template.user }}/.ssh/authorized_keys'
        stdin: "{{ proxmox_templates_template.sshkeys | join('\n') }}"
      delegate_to: "{{ proxmox_templates_template.node }}"
  when: proxmox_templates_template.type == 'lxc'

- name: "Allow SSH on VM/LXC (name: {{ proxmox_templates_template.name }}, node: {{ proxmox_templates_template.node }}, VM ID: {{ proxmox_templates_template.id }})"
  community.proxmox.proxmox_firewall:
    state: present
    level: vm
    vmid: "{{ proxmox_templates_template.id }}"
    rules:
      - comment: Allow SSH
        type: in
        action: ACCEPT
        macro: SSH
        enable: true
        pos: 1
