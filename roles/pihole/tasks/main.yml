- name: Ensure resolved.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  tags:
    - pihole

- name: Disable systemd-resolved stub listener
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/no-stub.conf
    content: |
      [Resolve]
      DNSStubListener=no
    mode: "0644"
  notify: Restart systemd-resolved
  tags:
    - pihole

- name: Point /etc/resolv.conf to upstream resolvers
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  tags:
    - pihole

- name: Apply changes now
  ansible.builtin.meta: flush_handlers
  tags:
    - pihole

- name: Create compose directory
  file:
    path: "{{ pihole_project_path }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  tags:
    - pihole

- name: Write compose file
  template:
    src: "{{ pihole_template_compose_yaml }}"
    dest: "{{ pihole_project_path }}/docker-compose.yaml"
    lstrip_blocks: true
    owner: root
    group: root
    mode: 0600
  tags:
    - pihole

- name: Run compose up
  community.docker.docker_compose_v2:
    project_src: "{{ pihole_project_path }}"
    state: present
    remove_orphans: true
  tags:
    - pihole

- name: Manage blocklists via API
  tags:
    - pihole
  block:
    - name: Authenticate to Pi-hole API
      uri:
        url: "{{ pihole_url }}/api/auth"
        method: POST
        body_format: json
        body:
          password: "{{ pihole_app_password }}"
        validate_certs: "{{ pihole_api_validate_certs }}"
      register: _pihole_auth
      until: _pihole_auth.status == 200
      retries: 20
      delay: 3
      no_log: true

    - name: Get current blocklists
      uri:
        url: "{{ pihole_url }}/api/lists?type=block"
        headers:
          X-FTL-SID: "{{ _pihole_auth.json.session.sid }}"
        validate_certs: "{{ pihole_api_validate_certs }}"
      register: _pihole_lists

    - name: Set current blocklist addresses
      set_fact:
        _pihole_current_blocklists: "{{ _pihole_lists.json.lists | map(attribute='address') | list }}"

    - name: Add blocklists
      uri:
        url: "{{ pihole_url }}/api/lists?type=block"
        method: POST
        headers:
          X-FTL-SID: "{{ _pihole_auth.json.session.sid }}"
        body_format: json
        body:
          address: "{{ item }}"
          type: block
          comment: Managed by Ansible
          enabled: true
          groups: [0]
        status_code: [200, 201]
        validate_certs: "{{ pihole_api_validate_certs }}"
      loop: "{{ pihole_blocklists | reject('in', _pihole_current_blocklists) | list }}"
      register: _pihole_blocklists_added
      changed_when: true

    - name: Remove unmanaged blocklists
      uri:
        url: "{{ pihole_url }}/api/lists/{{ item | urlencode | replace('/', '%2F') }}?type=block"
        method: DELETE
        headers:
          X-FTL-SID: "{{ _pihole_auth.json.session.sid }}"
        status_code: [200, 204]
        validate_certs: "{{ pihole_api_validate_certs }}"
      loop: "{{ _pihole_current_blocklists | reject('in', pihole_blocklists) | list }}"
      register: _pihole_blocklists_removed
      changed_when: true
      when: pihole_blocklists_purge | bool

    - name: Get current whitelists
      uri:
        url: "{{ pihole_url }}/api/lists?type=allow"
        headers:
          X-FTL-SID: "{{ _pihole_auth.json.session.sid }}"
        validate_certs: "{{ pihole_api_validate_certs }}"
      register: _pihole_lists

    - name: Set current whitelist addresses
      set_fact:
        _pihole_current_whitelists: "{{ _pihole_lists.json.lists | map(attribute='address') | list }}"

    - name: Add whitelists
      uri:
        url: "{{ pihole_url }}/api/lists?type=allow"
        method: POST
        headers:
          X-FTL-SID: "{{ _pihole_auth.json.session.sid }}"
        body_format: json
        body:
          address: "{{ item }}"
          type: allow
          comment: Managed by Ansible
          enabled: true
          groups: [0]
        status_code: [200, 201]
        validate_certs: "{{ pihole_api_validate_certs }}"
      loop: "{{ pihole_whitelists | reject('in', _pihole_current_whitelists) | list }}"
      register: _pihole_whitelists_added
      changed_when: true

    - name: Remove unmanaged whitelists
      uri:
        url: "{{ pihole_url }}/api/lists/{{ item | urlencode | replace('/', '%2F') }}?type=allow"
        method: DELETE
        headers:
          X-FTL-SID: "{{ _pihole_auth.json.session.sid }}"
        status_code: [200, 204]
        validate_certs: "{{ pihole_api_validate_certs }}"
      loop: "{{ _pihole_current_whitelists | reject('in', pihole_whitelists) | list }}"
      register: _pihole_whitelists_removed
      changed_when: true
      when: pihole_whitelists_purge | bool

    - name: Update gravity
      uri:
        url: "{{ pihole_url }}/api/action/gravity"
        method: POST
        headers:
          X-FTL-SID: "{{ _pihole_auth.json.session.sid }}"
        timeout: 900
        validate_certs: "{{ pihole_api_validate_certs }}"
      when: _pihole_blocklists_added is changed or _pihole_blocklists_removed is changed
  always:
    - name: Log out of Pi-hole API
      uri:
        url: "{{ pihole_url }}/api/auth"
        method: DELETE
        headers:
          X-FTL-SID: "{{ _pihole_auth.json.session.sid }}"
        status_code: [204, 401, 404]
        validate_certs: "{{ pihole_api_validate_certs }}"
      when: _pihole_auth.json.session.sid is defined
      failed_when: false
