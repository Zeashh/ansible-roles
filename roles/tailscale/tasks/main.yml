- name: Add Tailscale GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ tailscale_debian_suite }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"
  tags:
    - tailscale

- name: Add Tailscale repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/debian
    suites: "{{ tailscale_debian_suite }}"
    components: main
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
  tags:
    - tailscale

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    update_cache: true
  tags:
    - tailscale
